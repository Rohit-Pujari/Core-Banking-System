services:
  mysql:
    image: mysql:8.4
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: vault
      MYSQL_USER: bank_admin
      MYSQL_PASSWORD: bank_demo
      MYSQL_ROOT_PASSWORD: vault_root_demo
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-ubank_admin", "-pbank_demo", "vault", "-e", "SELECT 1"]
      interval: 3s
      retries: 40
  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/01-seed.js:ro
volumes:
  mongo_data:
  mysql_data:
